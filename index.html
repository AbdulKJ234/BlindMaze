<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="home">
        <div class="logo">

            <h1>BlindMaze</h1>
        </div>
        <div class="input">
            <div class="input-wrapper">
                <input required type="text" placeholder="Your name" id="userName">
                <button id="start-btn">Start</button>
            </div>
        </div>
        <div class="info">
            <button class="leaderboard">Leaderboard</button>
            <button class="instruction">Show instructions</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
